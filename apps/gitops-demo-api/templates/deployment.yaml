apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gitops-demo-api.fullname" . }}
  labels:
    {{- include "gitops-demo-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "gitops-demo-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gitops-demo-api.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: gitops-demo-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.healthCheck.path }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.healthCheck.path }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20