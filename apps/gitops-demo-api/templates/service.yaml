apiVersion: v1
kind: Service
metadata:
  name: {{ include "gitops-demo-api.fullname" . }}
  labels:
    {{- include "gitops-demo-api.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "gitops-demo-api.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
